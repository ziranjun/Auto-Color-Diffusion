  # --------------------------------------------------------------------------
  # 豆包（火山方舟 / Volcengine Ark）。密钥账户名 ARK_API_KEY。
  #
  # 以下事实逐条来自火山方舟官方文档（docs.volcengine.com/docs/82379，
  # 2026-09 核对；对话 API 页 1494384、模型列表页 1330310）：
  #   · 端点：`POST https://ark.cn-beijing.volces.com/api/v3/chat/completions`
  #     （另有一份 `.../api/v3/responses` 的 Responses API，本项目不用）。
  #   · 鉴权：官方示例 `--header "Authorization: Bearer $ARK_API_KEY"`，
  #     这也是本项目 key_env 取 ARK_API_KEY 的依据。
  #   · 请求体（官方参数表里**逐字**出现过的键）：model、messages、max_tokens
  #     （默认 4096，注为"最大回答长度"）、max_completion_tokens（"最大输出长度"）、
  #     response_format（"回答格式"）、reasoning_effort（"思考深度"）、
  #     service_tier、stream、stop、frequency_penalty、presence_penalty、
  #     logprobs、logit_bias、parallel_tool_calls。
  #     → max_tokens 与 max_completion_tokens 都在表里且后者语义是"总输出长度"
  #       （豆包自带深度思考，思维链也在花预算），所以这里用后者 ——
  #       这两个参数名都在官方表里逐字出现过，属于"合法字符"，
  #       不会被判成"写了不存在的参数"。
  #   · 图像理解：模型列表里 doubao-seed 全系都带"多模态理解"标签 → 支持图片。
  #     但**文档化的 image_url 子键里没写 detail**，故 sends_image_detail: false。
  #   · 结构化输出：模型列表里全系都带"结构化输出"标签，其中
  #     doubao-seed-2-1-pro-260628 等更被注为"推荐使用 json_schema 模式"。
  #     但"哪些模型吃哪套 schema 子集 / 是否要 strict"没有可摘录的原文，
  #     所以出厂只开 json_object（response_format 这个键本身是文档化的）；
  #     要试 json_schema，在**你自己的** config/models.yaml 里给具体模型加
  #     model_overrides: {doubao-seed-2-1-pro-260628: {supports_json_schema: true}}，
  #     万一被拒，客户端有一次"去掉 response_format 重发"的自愈（见 README）。
  #   · 上下文：doubao-seed-2-1 系 1024k / 256k 两档，这里取**保守的那档**
  #     256000，宁可早分批也不要半路 400。
  #   · 密钥自动识别：**故意不做**。官方公告只说了"2026-09-17 12:00（UTC+8）
  #     之后创建的 API Key 使用新的明文格式"，没有给出可写进代码的前缀字面量。
  #     认不出来就让人工在「服务商」里选 —— 猜一个前缀会把别人的 key 认成豆包，
  #     后果比多按一次下拉严重得多。
  # --------------------------------------------------------------------------
  doubao:
    label: "豆包（火山方舟）"
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
    endpoint_path: "/chat/completions"
    models_endpoint: "/models"
    key_env: "ARK_API_KEY"
    supports_vision: true
    # 结构化输出（上面注释里的依据）：response_format 这个**键**是官方参数表里的，
    # 所以 json_object 这一档可以放心开 —— 它只承诺"返回合法 JSON"，
    # 字段结构仍由提示词 + 本地 pydantic 强校验兜着。
    supports_json_object: true
    supports_json_schema: false
    sends_image_detail: false
    max_context: 256000
    max_output_tokens: 16384
    max_tokens_mode: "max_completion_tokens"
    temperature_output: 0.6
    temperature_train: 0.2
    request_timeout_s: 180
    default_models:
      - doubao-seed-2-1-pro-260628
      - doubao-seed-2-1-lite-260915

  # --------------------------------------------------------------------------
  # 百度千帆（文心 / ERNIE）。密钥 bce-v3/ 开头（官方示例：
  # `Authorization: Bearer bce-v3/ALTAK-*********/614fb**********`）。
  #
  # 以下事实逐条来自千帆官方文档（cloud.baidu.com/doc/qianfan-api/s/3m7of64lb
  # 文本生成、rm7u7qdiq 视觉理解、cloud.baidu.com/doc/qianfan/s/rmh4stp0j
  # 模型列表，2026-09 核对）：
  #   · 端点：文本生成与视觉理解**同一个** `POST /v2/chat/completions`
  #     （Host: qianfan.baidubce.com）→ base_url 带 /v2，路径只写 /chat/completions。
  #   · 图像输入形状（视觉理解页原文）：content 数组元素
  #     `{"type":"image_url","image_url":{"url": ...}}` + `{"type":"text","text": ...}`，
  #     **image_url 里只有 url 一个键** → sends_image_detail: false。
  #   · 输出上限：页面上同时有 max_tokens 与 max_completion_tokens，语义不同 ——
  #     max_tokens 只限制最终回答（content），不含思维链；max_completion_tokens
  #     是含思维链的总长，且"若同时设置了 max_tokens，则以本参数为准"。
  #     但 max_completion_tokens 明确写了"支持模型见上下文管理"（**不是所有模型**），
  #     而 max_tokens 是无条件文档化的那个 → 出厂用 max_tokens（一次只发一个）。
  #     上限 16384 取自 ernie-4.5-turbo-vl 的"最大输出 [2，16384]"；
  #     换成上限更小的模型（如 ernie-4.5-turbo-128k 是 12288）请用 model_overrides
  #     单独调小，否则会 400 —— 这条写在 README 的表里。
  #   · 思考模式：`thinking.enable_thinking` **默认 false**（不像 DeepSeek 默认开），
  #     所以这里不需要额外关；reasoning_effort 有 high（默认）/ max 两档。
  #   · response_format：页面写"指定响应内容的格式"，但明确"不支持 ERNIE X1 Turbo 系列"，
  #     且子键 {2} 的原文没摘到 → 只开 json_object，json_schema 留 false。
  #   · 模型：`ernie-4.5-turbo-vl`（128k 上下文 / 最大输出 16384）同时出现在
  #     "文本生成"与"视觉理解"两张表里；`ernie-5.0` 也两张表都在（128k / 65536）。
  #     原先把 `ernie-4.5-8k-preview` 当兜底，它只在视觉理解页的"支持模型"文字里
  #     被提到，不是模型列表里的一行 → 换成表里确凿存在的 ernie-5.0。
  # --------------------------------------------------------------------------
  qianfan:
    label: "百度千帆"
    base_url: "https://qianfan.baidubce.com/v2"
    endpoint_path: "/chat/completions"
    models_endpoint: "/models"
    key_env: "QIANFAN_API_KEY"
    supports_vision: true
    # 《视觉理解》页的 response_format 明文写着"支持以下模型：ERNIE 4.5 Turbo VL 系列…"
    # —— 正好是我们要用的那个模型，所以这一档是**文档化**的（不再是"无格式约束"）。
    # json_schema 仍留 false：页面上 response_format 的子键只摘到 object {2}，
    # 没摘到 schema / strict 的原文，不敢凭子键数量猜。
    supports_json_object: true
    supports_json_schema: false
    sends_image_detail: false
    max_context: 128000
    max_output_tokens: 16384
    temperature_output: 0.6
    temperature_train: 0.2
    request_timeout_s: 180
    default_models:
      - ernie-4.5-turbo-vl
      - ernie-5.0

  # --------------------------------------------------------------------------
  # Perplexity。密钥 pplx- 开头。**不支持图片输入**，会走 caption 降级通道
  # （界面上选中它时模型下方会有红字提示）。
  # --------------------------------------------------------------------------
  perplexity:
    label: "Perplexity"
    base_url: "https://api.perplexity.ai"
    endpoint_path: "/chat/completions"
    models_endpoint: "/models"
    key_env: "PERPLEXITY_API_KEY"
    supports_vision: false
    supports_json_schema: false
    max_context: 128000
    max_output_tokens: 4096
    temperature_output: 0.6
    temperature_train: 0.2
    request_timeout_s: 60
    default_models:
      - sonar
      - sonar-pro

