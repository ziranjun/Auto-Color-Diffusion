# ============================================================================
# 模型配置 —— 硬约束 #4：模型不得硬编码
# ----------------------------------------------------------------------------
# 本文件只描述**服务商**（端点 + 能力 + 密钥账户名），不写死具体 model id。
# 保存密钥后，程序会调用 `GET {base_url}/models` 拉取该服务商**真实可调用**的
# 模型列表，再填进「模型」下拉（结果缓存在 discovered_models.json）。
#
# 每个服务商必需字段：
#   label                  界面/状态栏里显示的名字
#   base_url               API 根地址（不含 /chat/completions）
#   endpoint_path          对话补全路径，默认 /chat/completions
#   models_endpoint        拉取模型列表的路径，默认 /models
#   key_env                keyring 中存密钥用的"账户名"，同时用作环境变量名回退
#   supports_vision        是否支持图片输入。false 时走 caption 降级通道（硬约束 #19）
#   supports_json_schema   是否支持 response_format.json_schema（服务端按 schema 约束）
#   supports_json_object   是否支持 response_format.json_object（只保证是合法 JSON）。
#                          两者都不支持时走"提示词 + 本地强校验"降级。
#                          三档的区别与本项目为何需要它的实证：DeepSeek 官方只有
#                          json_object；写 json_schema 过去会得到 400
#                          `This response_format type is unavailable now`。
#   max_context            上下文窗口 token 数，用于超长批次时的自动分批保护
# 可选字段：
#   model_overrides        **逐模型**覆盖上面的能力字段。同一个服务商下不同模型
#                          能力可以不同（实例：DeepSeek 的 deepseek-v4-pro
#                          不支持图像理解，deepseek-flash 支持）。写法：
#                              model_overrides:
#                                deepseek-v4-pro: {supports_vision: false}
#                          未写的字段继续继承服务商默认值。
#   extra_body             模型特有的请求体字段（原样合入 body）。用于各家自己的
#                          旋钮，例如 DeepSeek 的 thinking / reasoning_effort。
#                          model / messages / stream / response_format 四个键
#                          由程序管理，写进 extra_body 会被拒。
#   default_models         拉取失败 / 尚未拉取时的兜底模型（真实 id，不是占位）。
#                          顺序有含义：自动选中时会取**第一个支持视觉的**模型。
#   max_output_tokens      默认 4096
#   max_tokens_mode        输出上限**用哪个参数名**，三选一：
#                            "max_tokens"（默认）/ "max_completion_tokens" / "omit"
#                            · OpenAI 的推理模型（o 系 / gpt-5 及以后）**只认**
#                              max_completion_tokens，发 max_tokens 会 400；
#                            · Kimi 官方已把 max_tokens 标为 deprecated；
#                            · 阿里云百炼（qwen）官方写"开启结构化输出时请勿设置 max_tokens"
#                              → 用 omit。
#                            这张表的每一格都是"用户选到那个模型会不会报错"。
#   sends_temperature      是否发送 temperature（默认 true）。
#                            OpenAI 推理模型把 temperature 列为 Unsupported parameters。
#   sends_image_detail     图片消息里是否带 image_url.detail（默认 true）。
#                            detail 是 **OpenAI 的标准字段**，但"标准"不等于"每家都认"：
#                            百度千帆《视觉理解》的 image_url 只文档了 url 一个键，
#                            火山方舟《对话(Chat) API》的可摘录文档里也没给出 detail。
#                            严格网关接到文档外的字段会 400，而报错只说"参数错误"，
#                            根本读不出是它干的 —— 所以文档没写的家显式 false。
#   forbidden_schema_keywords  **这家额外**不认的 JSON Schema 关键字（默认空）。
#                            程序下发 schema 前会剥掉它们（另有全局一份：严格模式
#                            公认不支持的关键字，见 ai/schema.py）。
#   allow_anyof_in_schema  是否接受"可空联合"（anyOf / type 数组），默认 true。
#                            Kimi 的 MFJS 规范不支持 anyOf → 它这里是 false。
#                            关掉的连带后果：strict 会退化为非严格（strict 要求
#                            所有字段必填，而"可空"正是用来表达"这张图不用调它"），
#                            日志里会说明原因 —— 不是静默降级。
#   temperature_output     输出模式温度，默认 0.6
#   temperature_train      训练模式温度，硬约束 #19 规定 0.2
#   extra_headers          额外请求头（中转站常用）
#   image_max_bytes        单图 base64 前的字节上限，默认 1_500_000
#   request_timeout_s      单请求超时。**带图 + 要求结构化 JSON 的真实请求写在 180**：
#                            实测（2026-09-24）智谱 glm-5.3-flash（思考模式，且官方明文规定
#                            不可关闭）一次带图请求就要 51 秒；写 60 秒会让整批刚好撞在超时上。
#                            视觉服务商一律 180；纯文本/不接图的留 60。
# ============================================================================

providers:

  # --------------------------------------------------------------------------
  # DeepSeek。密钥账户名统一为 DEEPSEEK_API_KEY，两个模型共用一把。
  #
  # 以下事实全部来自 DeepSeek 官方文档（api-docs.deepseek.com，2026-09 核对）：
  #   · 模型只有两个：`deepseek-flash`（= DeepSeek-V4.1-Flash）与
  #     `deepseek-v4-pro`（= DeepSeek-V4-Pro-0813）。旧名 `deepseek-v4-flash`、
  #     `deepseek-v4-flash-vision-exp` 仍可调用，但实际由 V4.1-Flash 提供服务。
  #   · 「模型 & 价格」页面的功能表：**Json Output 两个都支持；图像理解
  #     flash 支持、v4-pro 不支持**。所以这里必须逐模型区分（见 model_overrides），
  #     否则选 V4 Pro 时程序会照发图片，得到一个含糊的 400。
  #   · 指南《JSON Output》写的是 response_format={'type':'json_object'}
  #     —— 它**不支持** json_schema。写 true 会被服务端拒：
  #     `This response_format type is unavailable now`（用户实际撞到过）。
  #   · 上下文 1M，单次输出最大 384K；思考模式默认开启（强度 high）。
  # --------------------------------------------------------------------------
  deepseek:
    label: "DeepSeek"
    base_url: "https://api.deepseek.com/v1"
    endpoint_path: "/chat/completions"
    models_endpoint: "/models"
    key_env: "DEEPSEEK_API_KEY"
    supports_vision: true
    supports_json_schema: false      # 官方只有 json_object，没有 json_schema
    supports_json_object: true        # 官方《JSON Output》指南明确支持
    max_context: 1000000              # 官方：上下文长度 1M
    # 官方默认：非思考模式 8K、思考模式 64K。本任务的输出只有一份 JSON，
    # 但思考模式的推理 token 也算在 max_tokens 里：给 4096 有被推理吃光、
    # 导致 content 为空或截断的风险，所以给 16K（只按实际生成计费）。
    max_output_tokens: 16384
    temperature_output: 0.6
    temperature_train: 0.2
    # 带图 + 思考模式（推理 token 也算输出）→ 60 秒实测不够用（2026-09-24 GLM 复盘）。
    request_timeout_s: 180
    # 想要更快的出 JSON（不跑推理），把下面这行打开即可；
    # reasoning_effort 的取值与含义见官方 create-chat-completion 的参数表
    # （none = 关闭思考模式）。默认不开：思考模式的效果更好，且这个参数
    # 在部分中转站上会被拒。
    # extra_body:
    #   reasoning_effort: "none"
    # 逐模型覆盖：V4 Pro **没有**图像理解能力（官方功能表明写）。
    # reason 是"为什么设这一条"的依据，会进日志提醒；建议写清出处或实测现象。
    model_overrides:
      deepseek-v4-pro:
        supports_vision: false
        reason: "DeepSeek 官方《模型 & 价格》页功能表：图像理解 flash 支持、v4-pro 不支持"
    # 拉取不到 /models 时的兜底（真实 id）。
    # 顺序有含义：保存密钥后程序自动选中的**第一个支持视觉的**模型 ——
    # 本工具的每条链路都靠缩略图判断，所以把能看图的 flash 放前面。
    default_models:
      - deepseek-flash
      - deepseek-v4-pro

  # --------------------------------------------------------------------------
  # OpenAI。密钥账户名统一为 OPENAI_API_KEY。
  # --------------------------------------------------------------------------
  openai:
    label: "OpenAI"
    base_url: "https://api.openai.com/v1"
    endpoint_path: "/chat/completions"
    models_endpoint: "/models"
    key_env: "OPENAI_API_KEY"
    supports_vision: true
    supports_json_schema: true
    supports_json_object: true
    max_context: 128000
    max_output_tokens: 4096
    # ── 下面两项是 2026-09 官方文档核对的结果（见 README「各家 API 核对表」）──
    # 推理模型（o 系 / gpt-5 及以后）在 Chat Completions 上**只接受**
    # max_completion_tokens；max_tokens 被列为支持参数之外。
    # gpt-4o 这类模型两个名字都认，所以统一用新名字不会影响老模型。
    max_tokens_mode: "max_completion_tokens"
    # 推理模型把 temperature / top_p 等列为 Unsupported parameters（发了就 400）。
    # 关掉后请求里不带 temperature，由服务端用自己的默认值；gpt-4o 也能接受。
    # 为什么这样定：用户从 /models 拉回来的列表里有大量推理模型，
    # 选到它们就报 400，而报错原文看不出是参数名的错（用户真实撞到过 DeepSeek 那类）。
    sends_temperature: false
    temperature_output: 0.6
    temperature_train: 0.2
    # 带图 + 结构化 JSON：60 秒实测偏紧（2026-09-24 GLM 复盘）→ 与其余视觉服务商统一。
    request_timeout_s: 180
    default_models:
      - gpt-4o
      - gpt-4o-mini

  # --------------------------------------------------------------------------
  # 通义千问（阿里云百炼 DashScope，OpenAI 兼容模式）。密钥账户名 DASHSCOPE_API_KEY。
  #
  # 以下事实来自阿里云百炼官方文档（help.aliyun.com/zh/model-studio，2026-09 核对，
  # 《OpenAI Chat 接口兼容》/《结构化输出》/《图像与视频理解》三篇）：
  #   · 结构化输出支持 JSON Object 与 JSON Schema 两种模式，但
  #     **JSON Schema 只支持部分模型**；而且它明确写着：
  #     「多模态输入（图像、视频、音频等）不支持 json_schema，会自动降级为
  #       json_object，schema 约束不生效」——本工具的**每一次请求都带图**，
  #     所以 json_schema 对这里毫无意义，统一走 json_object。
  #   · 「开启结构化输出时，请勿设置 max_tokens」——它会导致 JSON 被截断成
  #     非法 JSON，所以这里用 max_tokens_mode: omit（一个都不发）。
  #   · json_object 模式**必须**在 system/user 消息里出现 "JSON" 字样，
  #     否则 400：`'messages' must contain the word 'json' in some form…`。
  #     程序已保证这一点（提示词里带 schema 文本，首行含小写 json）。
  #   · 非流式调用服务端超时≥300 秒；思考模式（qwen3.x 默认开）建议用流式。
  #     这里给 180 秒：60 秒对"大图 + 思考模式"很容易超时。
  #   · base_url 官方现推荐业务空间专属域名
  #     https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com/compatible-mode/v1，
  #     老域名仍可用（这里用的就是老域名，无需你填 WorkspaceId）。
  #     ⚠ API Key **按地域绑定**：用北京的 Key 调新加坡端点会得到 401
  #     `Incorrect API key provided`——那不是 Key 坏了，是地域不对。
  #   · 未在文档中找到 GET /models 的说明；拉不到时程序会回退到 default_models
  #     并提示用「＋」手动填模型名，不影响使用。
  # --------------------------------------------------------------------------
  qwen:
    label: "通义千问 (Qwen)"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    endpoint_path: "/chat/completions"
    models_endpoint: "/models"
    key_env: "DASHSCOPE_API_KEY"
    supports_vision: true
    supports_json_schema: false      # 带图时官方不支持（会自动降级为 json_object）
    supports_json_object: true        # 官方《结构化输出》明确支持
    max_context: 128000
    max_output_tokens: 8192
    max_tokens_mode: "omit"           # 官方：开启结构化输出时勿设 max_tokens
    temperature_output: 0.6
    temperature_train: 0.2
    request_timeout_s: 180
    # 想要更快的出 JSON（不跑思考）：把下面两行打开即可。
    # enable_thinking / thinking_budget 是阿里云的非标准参数，走 extra_body。
    # extra_body:
    #   enable_thinking: false
    default_models:
      - qwen3-vl-plus
      - qwen3-vl-flash
      - qwen-vl-max

  # --------------------------------------------------------------------------
  # 智谱 GLM（OpenAI 兼容）。密钥账户名 ZHIPUAI_API_KEY。
  #
  # 以下事实来自智谱官方文档（docs.bigmodel.cn，2026-09 核对）：
  #   · 端点 https://open.bigmodel.cn/api/paas/v4/ + `Authorization: Bearer`。
  #     官方示例里的环境变量叫 ZAI_API_KEY；这里沿用了旧账户名
  #     ZHIPUAI_API_KEY（沿用是为了不让你已存的密钥失效，粘 Key 时程序
  #     本来也能按 `<id>.<secret>` 的形状自动认出 GLM）。
  #   · 《结构化输出》只文档了 `response_format={"type":"json_object"}`，
  #     没有 json_schema —— 所以保守用 json_object + 本地强校验。
  #   · 视觉：GLM-5.3-Flash 是原生多模态，`messages[].content[]` 里放
  #     `type: image_url` + Base64 Data URL（与我们的请求形状一致）。
  #   · 上下文 1M、最大输出 128K（GLM-5.3-Flash 官方规格页）。
  #   · temperature 区间是 (0,1)，默认 0.6。
  #   · 思考模式走 `extra_body={"thinking":{"type":"enabled"}}`；
  #     GLM-5.3-Flash 只支持 enabled（关不掉），所以这里不默认开。
  #     但它带的 reasoning_effort 旋钮很大，出 JSON 这类任务不必给它 max。
  # --------------------------------------------------------------------------
  glm:
    label: "智谱 GLM"
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    endpoint_path: "/chat/completions"
    models_endpoint: "/models"
    key_env: "ZHIPUAI_API_KEY"
    supports_vision: true
    supports_json_schema: false
    supports_json_object: true
    max_context: 1000000
    max_output_tokens: 16384
    temperature_output: 0.6
    temperature_train: 0.2
    request_timeout_s: 180
    # 未在文档中找到 GET /models 的说明；拉不到时回退到下面的默认模型。
    default_models:
      - glm-5.3-flash
      - glm-5.3

  # --------------------------------------------------------------------------
  # Google Gemini（走 OpenAI 兼容端点）。密钥账户名 GOOGLE_API_KEY，AIza 开头。
  # --------------------------------------------------------------------------
  gemini:
    label: "Google Gemini"
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
    endpoint_path: "/chat/completions"
    models_endpoint: "/models"
    key_env: "GOOGLE_API_KEY"
    supports_vision: true
    supports_json_schema: true
    max_context: 1048576
    max_output_tokens: 8192
    temperature_output: 0.6
    temperature_train: 0.2
    # 带图 + 结构化 JSON：60 秒实测偏紧（2026-09-24 GLM 复盘）→ 与其余视觉服务商统一。
    request_timeout_s: 180
    default_models:
      - gemini-2.5-flash
      - gemini-2.5-pro

  # --------------------------------------------------------------------------
  # Kimi（月之暗面 / Moonshot，OpenAI 兼容）。密钥账户名 MOONSHOT_API_KEY。
  #
  # 以下事实来自 Kimi 官方文档（platform.kimi.com/docs，2026-09 核对，含其
  # OpenAPI 规格）：
  #   · base_url https://api.moonshot.cn/v1，Bearer 鉴权，环境变量 MOONSHOT_API_KEY。
  #   · **max_tokens 已 deprecated，官方要求用 max_completion_tokens**；
  #     K3 默认 131072、上限 1048576；若"输入 + max_completion_tokens"
  #     超过上下文窗口会直接返回 invalid_request_error（所以上限要保守）。
  #   · 图片：`type: image_url` + Base64 Data URL；kimi-k3 / k2.7-code / k2.6
  #     都支持图片与视频（建议 ≤ 4K）。
  #   · json_object 官方明确支持（要求提示词里写清字段）；json_schema 也支持，
  #     但要求 schema 符合 **MFJS 规范**（不符合会报错或 warning），
  #     而我们的 schema 带 minimum/maximum 之类的范围约束（严格子集不支持）——
  #     所以默认走 json_object，想要强约束可在自己的配置里打开 json_schema。
  #   · 思考模式：kimi-k3 **总是思考**且默认 reasoning_effort=max（最重）；
  #     k2.6 默认 thinking.type=enabled。出参数这种事不需要那么重的推理，
  #     所以下面按模型给对应旋钮关小一点（想复原就把 model_overrides 那段删掉）。
  # --------------------------------------------------------------------------
  kimi:
    label: "Kimi (Moonshot)"
    base_url: "https://api.moonshot.cn/v1"
    endpoint_path: "/chat/completions"
    models_endpoint: "/models"
    key_env: "MOONSHOT_API_KEY"
    supports_vision: true
    supports_json_schema: false
    supports_json_object: true
    # MFJS 规范不支持 anyOf，所以这台端点的 schema 方言里没有"可空联合"。
    # 目前默认走 json_object（不发 schema），这条是为"用户自己想打开
    # json_schema"准备的：不设它，打开后会被服务端按不合规 schema 拒掉。
    allow_anyof_in_schema: false
    max_context: 256000
    max_output_tokens: 16384
    max_tokens_mode: "max_completion_tokens"
    temperature_output: 0.6
    temperature_train: 0.2
    request_timeout_s: 180
    # 官方《充值与限速》按**累计充值额**分档（代金券不计入累计充值）：
    #   Tier0（¥0）并发 1、RPM 3；Tier1（¥50）并发 15、RPM 100；再往上更高。
    # 出厂按 **Tier1** 写：档位决定的是"这个账户能同时跑几个请求"，按 Tier0 跑
    # 会让充过钱的用户白等（用户 2026-09-24 实测 Tier0 真值：4 工人并发 → 18 张
    # 只成功 1 张，其余全是 429）；而官方**没有**查询档位的接口（余额接口只回
    # 余额，对话响应里也没有 ratelimit 头），程序不可能自动判断。
    # 未充值的用户：在界面切到 Kimi 时会看到红字提示，**点一下**即改为 Tier0 ——
    # 那个选择写在 connections.yaml 里（连接优先于本文件，手改这里无效）。
    # 程序还会从 429 原文里读服务端写明的真值，并且只会收紧、不会放宽。
    max_concurrency: 15
    max_rpm: 100
    model_overrides:
      kimi-k3:
        max_context: 1000000
        reason: "Kimi 官方：K3 是 1M token 上下文（其余模型 256K）"
        extra_body:
          reasoning_effort: "low"
      kimi-k2.6:
        reason: "Kimi 官方：k2.6 默认 thinking.type=enabled；调参数不需要这么重的推理"
        # 服务端只接受 temperature=0.6（实测 400：invalid temperature: only 0.6 is allowed
        # for this model）。输出模式本来就用 0.6，但**训练模式发 0.2 会被 400 拒掉**，
        # 所以这里两个模式都写明 —— 程序也会从 400 原文里学这个值并记住。
        temperature_output: 0.6
        temperature_train: 0.6
        extra_body:
          thinking:
            type: "disabled"
    default_models:
      - kimi-k3
      - kimi-k2.6

  # --------------------------------------------------------------------------
  # OpenRouter（聚合站，一家就能调很多家的视觉模型）。密钥 sk-or-v1- 开头。
  # --------------------------------------------------------------------------
  openrouter:
    label: "OpenRouter"
    base_url: "https://openrouter.ai/api/v1"
    endpoint_path: "/chat/completions"
    models_endpoint: "/models"
    key_env: "OPENROUTER_API_KEY"
    supports_vision: true
    supports_json_schema: false     # 各家后端能力不一，走提示词 + 本地强校验降级
    max_context: 128000
    max_output_tokens: 4096
    temperature_output: 0.6
    temperature_train: 0.2
    # 带图 + 结构化 JSON：60 秒实测偏紧（2026-09-24 GLM 复盘）→ 与其余视觉服务商统一。
    request_timeout_s: 180
    default_models:
      - openai/gpt-4o
      - google/gemini-2.5-flash

  # --------------------------------------------------------------------------
